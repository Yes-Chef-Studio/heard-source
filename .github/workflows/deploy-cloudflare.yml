name: Deploy to Cloudflare

# Runs after the Heard checks pass on main, or by hand from the Actions tab.
on:
  workflow_run:
    workflows: [Heard]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          # On workflow_run, deploy exactly the commit that passed the checks.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      - name: Migrate the database
        working-directory: app/packages/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bunx drizzle-kit migrate

      - name: Install Cloudflare tooling
        working-directory: app/deploy/cloudflare
        run: npm ci --no-audit --no-fund

      - name: Write Worker secrets
        working-directory: app/deploy/cloudflare
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CAPTURE_SUBMIT_TOKEN_SECRET: ${{ secrets.CAPTURE_SUBMIT_TOKEN_SECRET }}
          RENDERER_SECRET: ${{ secrets.RENDERER_SECRET }}
          STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
          STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          umask 077
          jq -n \
            --arg DATABASE_URL "$DATABASE_URL" \
            --arg BETTER_AUTH_SECRET "$BETTER_AUTH_SECRET" \
            --arg CAPTURE_SUBMIT_TOKEN_SECRET "$CAPTURE_SUBMIT_TOKEN_SECRET" \
            --arg RENDERER_SECRET "$RENDERER_SECRET" \
            --arg STORAGE_ENDPOINT "https://${ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --arg STORAGE_ACCESS_KEY_ID "$STORAGE_ACCESS_KEY_ID" \
            --arg STORAGE_SECRET_ACCESS_KEY "$STORAGE_SECRET_ACCESS_KEY" \
            '$ARGS.named' > "$RUNNER_TEMP/secrets.json"

      - name: Deploy
        working-directory: app/deploy/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json"

      - name: Remove secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/secrets.json"

      - name: Check the site responds
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://heard.yeschef-dev.fyi/login || true)
            echo "attempt $i: $code"
            [ "$code" = 200 ] && exit 0
            sleep 10
          done
          echo "Heard didn't respond with 200 after deploy" >&2
          exit 1
