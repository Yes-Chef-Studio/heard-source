<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebGL fixture</title>
<style>body{margin:0;background:#1b1714;color:#fff;font:16px system-ui}canvas{display:block;width:100vw;height:70vh}h1{padding:24px;margin:0}</style></head>
<body><h1>WebGL fixture: animated scene, preserveDrawingBuffer=false</h1><canvas id="c"></canvas>
<script>
// Mimics a three.js site: continuous render loop, drawing buffer NOT preserved between frames.
const c = document.getElementById("c");
c.width = c.clientWidth; c.height = c.clientHeight;
const gl = c.getContext("webgl", { preserveDrawingBuffer: false });
const vs = gl.createShader(gl.VERTEX_SHADER); gl.shaderSource(vs, "attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}"); gl.compileShader(vs);
const fs = gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(fs, "precision mediump float;uniform vec2 r;void main(){vec2 u=gl_FragCoord.xy/r;gl_FragColor=vec4(u.x,0.45,u.y,1);}"); gl.compileShader(fs);
const pr = gl.createProgram(); gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr); gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-0.8,-0.8, 0.8,-0.8, 0,0.8]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(pr, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
gl.uniform2f(gl.getUniformLocation(pr, "r"), c.width, c.height);
(function frame() { gl.clearColor(0.11, 0.09, 0.08, 1); gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLES, 0, 3); requestAnimationFrame(frame); })();
</script></body></html>
